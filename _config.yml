title: 兰斤斤
subtitle: ''
description: 兰斤斤的个人博客
author: 兰斤斤
language: zh-CN
timezone: Asia/Shanghai
url: https://blog.lanjinjin.site
root: /
permalink: posts/:title/
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
skip_render:
  - vendor/**
  - img/**
  - css/**
  - js/**
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
index_generator:
  path: ''
  per_page: 6
  order_by: -date
per_page: 10
pagination_dir: page
date_format: YYYY-MM-DD
time_format: HH:mm
theme: fluid
markdown:
  preset: default
  render:
    html: true
    linkify: true
    typographer: false
  plugins:
    - '@traptitech/markdown-it-katex'
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
