<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" role="img" aria-label="四种多模态融合架构路线对比">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #dde5ef; stroke-width: 1; }
      .title { font: 600 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #213954; }
      .h { font: 600 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #213954; }
      .lbl { font: 600 11.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #252525; }
      .sub { font: 400 11px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526478; }
      .card { fill: #fafbfd; stroke: #d8e2ee; stroke-width: 1; }
      .v { fill: #cbe3f3; stroke: #4878a6; stroke-width: 1; }
      .t { fill: #cfe8db; stroke: #3e8363; stroke-width: 1; }
      .p { fill: #f7e5c3; stroke: #a87b2d; stroke-width: 1; }
      .u { fill: #e4daf2; stroke: #6f579e; stroke-width: 1; }
      .arr { stroke: #526478; stroke-width: 1.3; fill: none; marker-end: url(#a2); }
    </style>
    <marker id="a2" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#526478"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="858" height="328" rx="10" class="bg"/>
  <text x="24" y="32" class="title">多模态融合的四条架构路线：从末层点积到统一 Token 空间</text>

  <!-- Card 1: Dual Tower -->
  <rect x="24" y="50" width="192" height="258" rx="8" class="card"/>
  <text x="120" y="74" text-anchor="middle" class="h">A. 双塔浅融合</text>
  <text x="120" y="92" text-anchor="middle" class="sub">CLIP / SigLIP</text>
  <rect x="42" y="182" width="66" height="36" rx="5" class="v"/>
  <text x="75" y="204" text-anchor="middle" class="lbl">图像塔</text>
  <rect x="132" y="182" width="66" height="36" rx="5" class="t"/>
  <text x="165" y="204" text-anchor="middle" class="lbl">文本塔</text>
  <rect x="66" y="114" width="108" height="34" rx="5" class="p"/>
  <text x="120" y="135" text-anchor="middle" class="lbl">余弦相似度</text>
  <line x1="75" y1="182" x2="98" y2="151" class="arr"/>
  <line x1="165" y1="182" x2="142" y2="151" class="arr"/>
  <text x="120" y="248" text-anchor="middle" class="sub">仅末层交互 1 次</text>
  <text x="120" y="266" text-anchor="middle" class="sub">适合检索 / 特征提取</text>
  <text x="120" y="284" text-anchor="middle" class="sub">无法自回归生成</text>

  <!-- Card 2: Projector Concat -->
  <rect x="230" y="50" width="192" height="258" rx="8" class="card"/>
  <text x="326" y="74" text-anchor="middle" class="h">B. 输入拼接（主流）</text>
  <text x="326" y="92" text-anchor="middle" class="sub">LLaVA / Qwen-VL / InternVL</text>
  <rect x="246" y="196" width="72" height="30" rx="5" class="v"/>
  <text x="282" y="215" text-anchor="middle" class="lbl">ViT</text>
  <rect x="246" y="156" width="72" height="26" rx="5" class="p"/>
  <text x="282" y="173" text-anchor="middle" class="lbl">Projector</text>
  <rect x="334" y="196" width="72" height="30" rx="5" class="t"/>
  <text x="370" y="215" text-anchor="middle" class="lbl">文本 Emb</text>
  <rect x="246" y="108" width="160" height="34" rx="5" class="t"/>
  <text x="326" y="129" text-anchor="middle" class="lbl">LLM Self-Attention</text>
  <line x1="282" y1="196" x2="282" y2="184" class="arr"/>
  <line x1="282" y1="156" x2="296" y2="144" class="arr"/>
  <line x1="370" y1="196" x2="360" y2="144" class="arr"/>
  <text x="326" y="248" text-anchor="middle" class="sub">不改 LLM 结构，复用度高</text>
  <text x="326" y="266" text-anchor="middle" class="sub">图 token 吃上下文长度</text>
  <text x="326" y="284" text-anchor="middle" class="sub">与 KV Cache 预算</text>

  <!-- Card 3: Cross-Attention -->
  <rect x="436" y="50" width="192" height="258" rx="8" class="card"/>
  <text x="532" y="74" text-anchor="middle" class="h">C. 层间交叉注意力</text>
  <text x="532" y="92" text-anchor="middle" class="sub">Flamingo / Llama 3.2 Vision</text>
  <rect x="450" y="182" width="60" height="44" rx="5" class="v"/>
  <text x="480" y="202" text-anchor="middle" class="lbl">ViT</text>
  <text x="480" y="218" text-anchor="middle" class="sub">K, V</text>
  <rect x="528" y="196" width="84" height="30" rx="5" class="t"/>
  <text x="570" y="215" text-anchor="middle" class="lbl">LLM Layer 1</text>
  <rect x="528" y="154" width="84" height="28" rx="5" class="p"/>
  <text x="570" y="172" text-anchor="middle" class="lbl">Cross-Attn</text>
  <rect x="528" y="108" width="84" height="30" rx="5" class="t"/>
  <text x="570" y="127" text-anchor="middle" class="lbl">LLM Layer 2</text>
  <line x1="570" y1="196" x2="570" y2="184" class="arr"/>
  <line x1="570" y1="154" x2="570" y2="140" class="arr"/>
  <line x1="510" y1="198" x2="526" y2="170" class="arr"/>
  <text x="532" y="248" text-anchor="middle" class="sub">视觉逐层注入、不占文本槽</text>
  <text x="532" y="266" text-anchor="middle" class="sub">需侵入修改 LLM 主干</text>
  <text x="532" y="284" text-anchor="middle" class="sub">推理框架适配成本高</text>

  <!-- Card 4: Native Unified -->
  <rect x="642" y="50" width="194" height="258" rx="8" class="card"/>
  <text x="739" y="74" text-anchor="middle" class="h">D. 原生统一多模态</text>
  <text x="739" y="92" text-anchor="middle" class="sub">Chameleon / Gemini</text>
  <rect x="658" y="196" width="76" height="30" rx="5" class="v"/>
  <text x="696" y="215" text-anchor="middle" class="lbl">图像 Token</text>
  <rect x="744" y="196" width="76" height="30" rx="5" class="t"/>
  <text x="782" y="215" text-anchor="middle" class="lbl">文本 Token</text>
  <rect x="658" y="108" width="162" height="62" rx="5" class="u"/>
  <text x="739" y="134" text-anchor="middle" class="lbl">单一多模态 Transformer</text>
  <text x="739" y="154" text-anchor="middle" class="sub">统一词表 / 联合训练</text>
  <line x1="696" y1="196" x2="706" y2="172" class="arr"/>
  <line x1="782" y1="196" x2="772" y2="172" class="arr"/>
  <text x="739" y="248" text-anchor="middle" class="sub">支持理解 + 生成统一</text>
  <text x="739" y="266" text-anchor="middle" class="sub">跨模态训练动态难调</text>
  <text x="739" y="284" text-anchor="middle" class="sub">算力与数据门槛最高</text>
</svg>
